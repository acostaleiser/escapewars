/* ─── ICONS ─────────────────────────────────────────── */
const Icon = ({ name, size = 20, color = "currentColor" }) => {
  const paths = {
    back: <path d="M15 19l-7-7 7-7" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" fill="none" />,
    trophy: <><path d="M6 2h12v8a6 6 0 01-12 0V2z" stroke={color} strokeWidth="2" fill="none" strokeLinejoin="round" /><path d="M6 5H3a2 2 0 000 4h3M18 5h3a2 2 0 010 4h-3M12 16v4M8 20h8" stroke={color} strokeWidth="2" strokeLinecap="round" fill="none" /></>,
    timer: <><circle cx="12" cy="12" r="9" stroke={color} strokeWidth="2" fill="none" /><path d="M12 7v5l3 3" stroke={color} strokeWidth="2" strokeLinecap="round" fill="none" /></>,
    plus: <path d="M12 5v14M5 12h14" stroke={color} strokeWidth="2.2" strokeLinecap="round" />,

    edit: <><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" /></>,
    check: <path d="M20 6L9 17l-5-5" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" fill="none" />,
    x: <path d="M18 6L6 18M6 6l12 12" stroke={color} strokeWidth="2.2" strokeLinecap="round" />,
    star: <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke={color} strokeWidth="2" fill="none" strokeLinejoin="round" />,

};

/* ─── SHARED COMPONENTS ─────────────────────────────── */
const Pill = ({ children, color, bg, onClick, style = {}, size = "md" }) => {
  const pad = size === "sm" ? "6px 14px" : size === "lg" ? "14px 32px" : "10px 22px";
  const fs = size === "sm" ? 13 : size === "lg" ? 17 : 15;
  return (
    <button onClick={onClick} style={{
      background: bg || color || "#6B4EFF",
      color: color && !bg ? "#fff" : bg ? color || "#6B4EFF" : "#fff",
      border: bg && color ? `2px solid ${color}` : "none",
      borderRadius: 100,
      padding: pad,
      fontSize: fs,
      fontWeight: 600,
      cursor: "pointer",
      fontFamily: "DM Sans, sans-serif",
      display: "inline-flex",
      alignItems: "center",
      gap: 7,
      transition: "all .15s",
      ...style
    }}>
      {children}
    </button>);

};

const Card = ({ children, style = {}, onClick }) =>
<div onClick={onClick} style={{
  background: "#fff",
  borderRadius: 20,
  padding: "16px 18px",
  boxShadow: "0 2px 12px rgba(0,0,0,0.06)",
  cursor: onClick ? "pointer" : "default",
  transition: onClick ? "transform .12s, box-shadow .12s" : undefined,
  ...style
}}
onMouseEnter={(e) => {if (onClick) {e.currentTarget.style.transform = "translateY(-1px)";e.currentTarget.style.boxShadow = "0 6px 20px rgba(0,0,0,0.10)";}}}
onMouseLeave={(e) => {if (onClick) {e.currentTarget.style.transform = "";e.currentTarget.style.boxShadow = "0 2px 12px rgba(0,0,0,0.06)";}}}>
  
    {children}
  </div>;


const Header = ({ title, onBack, action, accent }) =>
<div style={{
  display: "flex", alignItems: "center", justifyContent: "space-between",
  padding: "12px 20px 8px", gap: 8
}}>
    <div style={{ display: "flex", alignItems: "center", gap: 8, flex: 1 }}>

    <button onClick={onBack} style={{

<span style={{

            <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 13, fontWeight: 500 }}>Welcome back 👋</p>

/* ─── SCREEN 2: SEASON DETAIL ─────────────────────── */
const SeasonDetailScreen = ({ season, onBack, onStartGame, onManageTeams, accent }) => {
  const sorted = [...season.teams].sort((a, b) => b.points - a.points);
  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 24 }}>
      <div style={{

      }}>

          background: "rgba(255,255,255,0.2)", border: "none", borderRadius: 12,
          padding: "8px 14px", color: "#fff", fontSize: 13, fontWeight: 600,

              <div key={team.id} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>

/* ─── SCREEN 3: LIVE GAME ───────────────────────────── */
const LiveGameScreen = ({ season, onBack, onFinish, accent }) => {
  const DURATION = 45 * 60;
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(true);
  const [escaped, setEscaped] = useState({});
  const intervalRef = useRef(null);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setElapsed((e) => {
          if (e >= DURATION) {setRunning(false);return DURATION;}
          return e + 1;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const fmt = (s) => {
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return `${m}:${sec}`;
  };

  const progress = elapsed / DURATION;
  const r = 72,circ = 2 * Math.PI * r;

  const toggleEscaped = (id) => {
    setEscaped((prev) => ({ ...prev, [id]: !prev[id] }));
  };

  const escapedCount = Object.values(escaped).filter(Boolean).length;

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 24 }}>
      <div style={{
        background: `linear-gradient(160deg, #1a1a2e 0%, #2D1B69 100%)`,
        padding: "12px 20px 32px", borderRadius: "0 0 32px 32px"
      }}>
        <Header title="Live Game" onBack={onBack} accent={accent}
        action={
        <button onClick={() => setRunning((r) => !r)} style={{
          background: running ? "rgba(255,80,80,0.25)" : "rgba(80,255,150,0.25)",
          border: "none", borderRadius: 12, padding: "8px 14px",
          color: running ? "#FF8080" : "#50FF96", fontSize: 13, fontWeight: 700,
          cursor: "pointer", fontFamily: "DM Sans, sans-serif"
        }}>
              {running ? "⏸ Pause" : "▶ Resume"}
            </button>
        } />
        
        {/* Timer circle */}
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginTop: 16 }}>
          <svg width={180} height={180} viewBox="0 0 180 180">
            <circle cx={90} cy={90} r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth={8} />
            <circle cx={90} cy={90} r={r} fill="none"
            stroke={progress > 0.8 ? "#FF5050" : progress > 0.6 ? "#FFB830" : accent}
            strokeWidth={8} strokeLinecap="round"
            strokeDasharray={circ}
            strokeDashoffset={circ * (1 - progress)}
            transform="rotate(-90 90 90)"
            style={{ transition: "stroke-dashoffset 0.8s linear, stroke 0.5s" }} />
            
            <text x={90} y={84} textAnchor="middle" fill="#fff" fontSize={32} fontWeight={800} fontFamily="DM Sans, sans-serif">{fmt(elapsed)}</text>
            <text x={90} y={106} textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize={13} fontFamily="DM Sans, sans-serif">
              of {fmt(DURATION)}
            </text>
          </svg>
          <div style={{ display: "flex", gap: 16, marginTop: 4 }}>
            <div style={{ textAlign: "center" }}>
              <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>Escaped</p>
              <p style={{ color: "#50FF96", fontSize: 22, fontWeight: 800 }}>{escapedCount}</p>
            </div>
            <div style={{ textAlign: "center" }}>
              <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>Remaining</p>
              <p style={{ color: "#fff", fontSize: 22, fontWeight: 800 }}>{season.teams.length - escapedCount}</p>
            </div>
            <div style={{ textAlign: "center" }}>
              <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>Time left</p>
              <p style={{ color: progress > 0.8 ? "#FF8080" : "#fff", fontSize: 22, fontWeight: 800 }}>{fmt(DURATION - elapsed)}</p>
            </div>
          </div>
        </div>
      </div>

      <div style={{ textAlign: "left", padding: "20px 16px 0px", height: "450px", color: "blue" }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e", marginBottom: 12 }}>Teams — Tap when escaped</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          {season.teams.map((team, idx) => {
            const isEscaped = escaped[team.id];
            const escapeOrder = isEscaped ? Object.entries(escaped).filter(([, v]) => v).map(([k]) => parseInt(k)).indexOf(team.id) + 1 : null;
            return (
              <button key={team.id} onClick={() => toggleEscaped(team.id)} style={{
                background: isEscaped ? team.color + "15" : "#fff",
                border: isEscaped ? `2px solid ${team.color}` : "2px solid transparent",
                borderRadius: 20, padding: "14px 16px", cursor: "pointer",
                fontFamily: "DM Sans, sans-serif",
                display: "flex", alignItems: "center", gap: 12,
                transition: "all .2s",
                boxShadow: isEscaped ? `0 4px 16px ${team.color}30` : "0 2px 8px rgba(0,0,0,0.06)"
              }}>
                <div style={{
                  width: 40, height: 40, borderRadius: 13,
                  background: isEscaped ? team.color : team.color + "20",
                  display: "flex", alignItems: "center", justifyContent: "center",
                  transition: "all .2s"

                <div style={{ flex: 1, textAlign: "left" }}>

                  <p style={{ fontSize: 12, color: "#9494AF" }}>

                  </p>
                </div>
                {isEscaped && escapeOrder === 1 && <span style={{ fontSize: 20 }}>🥇</span>}
                {isEscaped && escapeOrder === 2 && <span style={{ fontSize: 20 }}>🥈</span>}
                {isEscaped && escapeOrder === 3 && <span style={{ fontSize: 20 }}>🥉</span>}
              </button>);

          width: "100%", color: "#fff", border: "none", borderRadius: 20,

        }}>

};

/* ─── SCREEN 4: RESULT ENTRY ────────────────────────── */
const ResultScreen = ({ season, escapedMap, finalTime, onBack, onSave, accent }) => {
  const fmt = (s) => {
    const m = Math.floor(s / 60).toString().padStart(2, "0");
    const sec = (s % 60).toString().padStart(2, "0");
    return `${m}:${sec}`;
  };
  const escapedIds = Object.entries(escapedMap || {}).filter(([, v]) => v).map(([k]) => parseInt(k));
  const [bonuses, setBonuses] = useState({});
  const [notes, setNotes] = useState("");

  const BASE_POINTS = [10, 7, 5, 3];

  const getBase = (teamId) => {
    const order = escapedIds.indexOf(teamId);
    if (order === -1) return 0;
    return BASE_POINTS[order] ?? 1;
  };

  const sorted = [...season.teams].sort((a, b) => {
    const aEsc = escapedIds.indexOf(a.id);
    const bEsc = escapedIds.indexOf(b.id);
    if (aEsc === -1 && bEsc === -1) return 0;
    if (aEsc === -1) return 1;
    if (bEsc === -1) return -1;
    return aEsc - bEsc;
  });

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 32 }}>
      <div style={{
        background: `linear-gradient(135deg, ${accent} 0%, #3B1FA8 100%)`,
        padding: "12px 20px 28px", borderRadius: "0 0 32px 32px"
      }}>
        <Header title="Game Results" onBack={onBack} accent={accent} />
        <div style={{ padding: "8px 20px 0", display: "flex", gap: 14 }}>
          <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 14, padding: "10px 16px", flex: 1 }}>
            <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>TOTAL TIME</p>
            <p style={{ color: "#fff", fontSize: 20, fontWeight: 800 }}>{fmt(finalTime || 0)}</p>
          </div>
          <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 14, padding: "10px 16px", flex: 1 }}>
            <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>ESCAPED</p>
            <p style={{ color: "#fff", fontSize: 20, fontWeight: 800 }}>{escapedIds.length}/{season.teams.length}</p>
          </div>
          <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 14, padding: "10px 16px", flex: 1 }}>
            <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 11 }}>DATE</p>
            <p style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>May 1, 2026</p>
          </div>
        </div>
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e", marginBottom: 12 }}>Points Breakdown</h3>
        <p style={{ fontSize: 13, color: "#9494AF", marginBottom: 16 }}>Base points are assigned by escape order. Add bonus points manually.</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          {sorted.map((team, idx) => {
            const escaped = escapedIds.includes(team.id);
            const order = escapedIds.indexOf(team.id);
            const base = getBase(team.id);
            const bonus = parseInt(bonuses[team.id] || 0);
            const total = base + bonus;
            return (
              <Card key={team.id} style={{ padding: "14px 16px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <span style={{ fontSize: 18, width: 26 }}>
                    {escaped ? MEDALS[order] || `${order + 1}` : "❌"}
                  </span>
                  <div style={{ flex: 1 }}>
                    <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{team.name}</p>
                    <p style={{ fontSize: 12, color: escaped ? "#50AA70" : "#FF6B6B", fontWeight: 600 }}>
                      {escaped ? `Escaped — Base: +${base} pts` : "Did not escape — 0 pts"}
                    </p>
                  </div>
                  {escaped &&
                  <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <button onClick={() => setBonuses((prev) => ({ ...prev, [team.id]: Math.max(0, (prev[team.id] || 0) - 1) }))} style={{
                      width: 28, height: 28, borderRadius: 10, background: "#F0EFF8", border: "none",
                      cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 16, fontWeight: 700, color: "#6B4EFF"
                    }}>−</button>
                      <div style={{ textAlign: "center", minWidth: 40 }}>
                        <p style={{ fontSize: 18, fontWeight: 800, color: accent }}>{total}</p>
                        <p style={{ fontSize: 10, color: "#9494AF" }}>pts</p>
                      </div>
                      <button onClick={() => setBonuses((prev) => ({ ...prev, [team.id]: (prev[team.id] || 0) + 1 }))} style={{
                      width: 28, height: 28, borderRadius: 10, background: accent, border: "none",
                      cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 16, fontWeight: 700, color: "#fff"
                    }}>+</button>
                    </div>
                  }
                  {!escaped &&
                  <p style={{ fontSize: 18, fontWeight: 800, color: "#CCC" }}>0 pts</p>
                  }
                </div>
              </Card>);

          })}
        </div>

        <div style={{ marginBottom: 20 }}>
          <p style={{ fontSize: 14, fontWeight: 600, color: "#1a1a2e", marginBottom: 8 }}>Notes (optional)</p>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Any notes about this game…" style={{
            width: "100%", borderRadius: 16, border: "1.5px solid #E0DFF0", padding: "12px 14px",
            fontSize: 14, fontFamily: "DM Sans, sans-serif", color: "#1a1a2e", resize: "none",
            background: "#fff", outline: "none", height: 80
          }} />
        </div>

        <button onClick={onSave} style={{
          width: "100%", background: accent, color: "#fff", border: "none", borderRadius: 20,
          padding: "16px 0", fontSize: 17, fontWeight: 700, cursor: "pointer",
          fontFamily: "DM Sans, sans-serif", display: "flex", alignItems: "center",
          justifyContent: "center", gap: 10, boxShadow: `0 8px 24px ${accent}40`
        }}>
          <Icon name="check" size={20} color="#fff" />
          Save Results
        </button>
      </div>
    </div>);

};

/* ─── SCREEN 5: TEAM MANAGEMENT ─────────────────────── */
const TeamManagementScreen = ({ season, onBack, accent }) => {
  const [teams, setTeams] = useState(season.teams);

  const addTeam = () => {
    if (!newName.trim()) return;
    setTeams((prev) => [...prev, {
      id: Date.now(), name: newName.trim(),
      color: COLORS[prev.length % COLORS.length],
      wins: 0, losses: 0, points: 0, bestTime: "—"
    }]);
    setNewName("");
    setAdding(false);
  };

  const removeTeam = (id) => setTeams((prev) => prev.filter((t) => t.id !== id));

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 32 }}>
      <div style={{
        background: `linear-gradient(135deg, ${accent} 0%, #3B1FA8 100%)`,

          display: "flex", alignItems: "center", gap: 6

              <Icon name="plus" size={15} color="#fff" />Add

        } />
        
        <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 14, padding: "4px 20px 0" }}>
          {season.name} · {teams.length} teams
        </p>

      <div style={{ padding: "20px 16px 0" }}>
        {adding &&
        <Card style={{ padding: "16px", marginBottom: 16, border: `2px solid ${accent}30` }}>
            <p style={{ fontSize: 14, fontWeight: 700, color: "#1a1a2e", marginBottom: 10 }}>New Team</p>
            <input
            value={newName} onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addTeam()}

              width: "100%", border: `1.5px solid ${accent}50`, borderRadius: 12,
              padding: "10px 14px", fontSize: 15, fontFamily: "DM Sans, sans-serif",
              outline: "none", color: "#1a1a2e", marginBottom: 10
            }} />
          
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={addTeam} style={{
              flex: 1, background: accent, color: "#fff", border: "none", borderRadius: 12,
              padding: "10px 0", fontSize: 14, fontWeight: 700, cursor: "pointer",
              fontFamily: "DM Sans, sans-serif"
            }}>Add Team</button>
              <button onClick={() => setAdding(false)} style={{
              background: "#F0EFF8", color: "#8888A0", border: "none", borderRadius: 12,
              padding: "10px 16px", fontSize: 14, fontWeight: 600, cursor: "pointer",
              fontFamily: "DM Sans, sans-serif"
            }}>Cancel</button>
            </div>
          </Card>
        }

        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {teams.map((team) =>
          <Card key={team.id} style={{ padding: "14px 16px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{
                width: 42, height: 42, borderRadius: 14, background: team.color + "20",
                display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0
              }}>
                  <Icon name="team" size={20} color={team.color} />
                </div>
                <div style={{ flex: 1 }}>
                  <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{team.name}</p>

                </div>

                  <button onClick={() => removeTeam(team.id)} style={{
                  width: 32, height: 32, background: "#FFE8E8", border: "none", borderRadius: 10,

};

        {screen === "newSeason" && <NewSeasonScreen accent={accent} onBack={() => {}} onSave={() => {}} />}
      </div>
    </IOSDevice>);

};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
