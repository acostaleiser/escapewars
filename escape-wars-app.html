<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── CONSTANTS ──────────────────────────────────────── */
const ACCENT = "#6B4EFF";
const MEDALS = ["🥇", "🥈", "🥉"];
const TEAM_COLORS = ["#6B4EFF","#FF4E8B","#00C896","#FF8C42","#3BAFDA","#FFD600","#E040FB","#00BFA5","#FF5252","#64B5F6"];
const BASE_PTS = [10, 7, 5, 3, 2, 1];

/* ─── STORAGE ────────────────────────────────────────── */
const STORAGE_KEY = 'escape-wars-data';
const defaultData = {
  seasons: [
    {
      id: 1, name: "Season 1", subtitle: "The Haunted Mansion", year: 2025, active: false,
      pointsWin: 10, pointsDraw: 3, pointsLoss: 0,
      teams: [
        { id: 1, name: "The Cryptkeepers", color: "#6B4EFF", wins: 8, losses: 2, points: 84, bestTime: "23:12" },
        { id: 2, name: "Puzzle Bandits",   color: "#FF4E8B", wins: 7, losses: 3, points: 71, bestTime: "24:50" },
        { id: 3, name: "The Riddlers",     color: "#00C896", wins: 6, losses: 4, points: 62, bestTime: "25:33" },
        { id: 4, name: "Lock Pickers",     color: "#FF8C42", wins: 5, losses: 5, points: 50, bestTime: "26:18" },
        { id: 5, name: "Cipher Squad",     color: "#3BAFDA", wins: 4, losses: 6, points: 41, bestTime: "27:44" },
      ],
      games: 10,
    },
    {
      id: 2, name: "Season 2", subtitle: "The Lost Laboratory", year: 2026, active: true,
      pointsWin: 10, pointsDraw: 3, pointsLoss: 0,
      teams: [
        { id: 1, name: "The Cryptkeepers", color: "#6B4EFF", wins: 3, losses: 1, points: 33, bestTime: "21:05" },
        { id: 2, name: "Puzzle Bandits",   color: "#FF4E8B", wins: 3, losses: 1, points: 31, bestTime: "22:11" },
        { id: 3, name: "Brain Escapers",   color: "#00C896", wins: 2, losses: 2, points: 22, bestTime: "24:40" },
        { id: 4, name: "The Riddlers",     color: "#FF8C42", wins: 1, losses: 3, points: 12, bestTime: "26:55" },
        { id: 5, name: "Lock Pickers",     color: "#3BAFDA", wins: 1, losses: 3, points: 10, bestTime: "28:02" },
      ],
      games: 4,
    },
  ],
};

const loadData = () => {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : defaultData;
  } catch { return defaultData; }
};

const saveData = (data) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
};

/* ─── ICONS ──────────────────────────────────────────── */
const Icon = ({ name, size = 20, color = "currentColor" }) => {
  const paths = {
    back:     <path d="M15 19l-7-7 7-7" stroke={color} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
    trophy:   <><path d="M6 2h12v8a6 6 0 01-12 0V2z" stroke={color} strokeWidth="2" fill="none" strokeLinejoin="round"/><path d="M6 5H3a2 2 0 000 4h3M18 5h3a2 2 0 010 4h-3M12 16v4M8 20h8" stroke={color} strokeWidth="2" strokeLinecap="round" fill="none"/></>,
    timer:    <><circle cx="12" cy="12" r="9" stroke={color} strokeWidth="2" fill="none"/><path d="M12 7v5l3 3" stroke={color} strokeWidth="2" strokeLinecap="round" fill="none"/></>,
    plus:     <path d="M12 5v14M5 12h14" stroke={color} strokeWidth="2.2" strokeLinecap="round"/>,
    team:     <><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round"/><circle cx="9" cy="7" r="4" stroke={color} strokeWidth="2" fill="none"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round"/></>,
    edit:     <><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></>,
    check:    <path d="M20 6L9 17l-5-5" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
    x:        <path d="M18 6L6 18M6 6l12 12" stroke={color} strokeWidth="2.2" strokeLinecap="round"/>,
    star:     <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke={color} strokeWidth="2" fill="none" strokeLinejoin="round"/>,
    lightning:<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke={color} strokeWidth="2" fill="none" strokeLinejoin="round" strokeLinecap="round"/>,
    calendar: <><rect x="3" y="4" width="18" height="18" rx="2" stroke={color} strokeWidth="2" fill="none"/><path d="M16 2v4M8 2v4M3 10h18" stroke={color} strokeWidth="2" strokeLinecap="round"/></>,
    trash:    <><polyline points="3 6 5 6 21 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/><path d="M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/></>,
    share:    <><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8" stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/><polyline points="16 6 12 2 8 6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" fill="none"/><line x1="12" y1="2" x2="12" y2="15" stroke={color} strokeWidth="2" strokeLinecap="round"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" style={{ flexShrink: 0, display: "block" }}>
      {paths[name]}
    </svg>
  );
};

/* ─── SHARED UI ──────────────────────────────────────── */
const Card = ({ children, style = {}, onClick }) => (
  <div onClick={onClick} style={{
    background: "#fff", borderRadius: 20, padding: "16px 18px",
    boxShadow: "0 2px 12px rgba(0,0,0,0.06)",
    cursor: onClick ? "pointer" : "default",
    WebkitTapHighlightColor: "transparent",
    ...style,
  }}>{children}</div>
);

const Header = ({ title, onBack, action }) => (
  <div style={{
    display: "flex", alignItems: "center", justifyContent: "space-between",
    padding: "8px 20px 8px", gap: 8,
  }}>
    <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, minWidth: 0 }}>
      {onBack && (
        <button onClick={onBack} style={{
          background: "rgba(255,255,255,0.2)", border: "none", borderRadius: 12,
          width: 38, height: 38, display: "flex", alignItems: "center", justifyContent: "center",
          cursor: "pointer", flexShrink: 0,
        }}>
          <Icon name="back" size={18} color="#fff" />
        </button>
      )}
      <h1 style={{ fontSize: 20, fontWeight: 700, color: "#fff", lineHeight: 1.2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</h1>
    </div>
    {action}
  </div>
);

const Btn = ({ children, onClick, variant = "solid", color = ACCENT, style = {}, disabled = false }) => {
  const base = {
    border: "none", borderRadius: 100, cursor: disabled ? "not-allowed" : "pointer",
    fontFamily: "DM Sans, sans-serif", fontWeight: 700, fontSize: 15,
    display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
    padding: "12px 24px", transition: "opacity .15s", opacity: disabled ? 0.5 : 1,
    WebkitTapHighlightColor: "transparent",
    ...style,
  };
  if (variant === "solid") return <button onClick={!disabled ? onClick : undefined} style={{ ...base, background: color, color: "#fff", boxShadow: `0 6px 20px ${color}40` }}>{children}</button>;
  if (variant === "ghost") return <button onClick={!disabled ? onClick : undefined} style={{ ...base, background: color + "15", color }}>{children}</button>;
  if (variant === "outline") return <button onClick={!disabled ? onClick : undefined} style={{ ...base, background: "#fff", color, border: `2px solid ${color}30` }}>{children}</button>;
  if (variant === "dark") return <button onClick={!disabled ? onClick : undefined} style={{ ...base, background: "#1a1a2e", color: "#fff", boxShadow: "0 6px 20px rgba(26,26,46,0.3)" }}>{children}</button>;
};

const Badge = ({ children, color = ACCENT }) => (
  <span style={{ background: color + "18", color, borderRadius: 100, padding: "3px 10px", fontSize: 12, fontWeight: 600 }}>{children}</span>
);

const Toast = ({ message, onDone }) => {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return (
    <div style={{
      position: "fixed", bottom: 90, left: "50%", transform: "translateX(-50%)",
      background: "#1a1a2e", color: "#fff", borderRadius: 100, padding: "12px 24px",
      fontSize: 14, fontWeight: 600, whiteSpace: "nowrap",
      boxShadow: "0 8px 32px rgba(0,0,0,0.3)", zIndex: 9999,
      animation: "fadeUp .3s ease",
    }}>✅ {message}</div>
  );
};

/* ─── INSTALL PROMPT ─────────────────────────────────── */
const InstallBanner = () => {
  const [prompt, setPrompt] = useState(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const handler = (e) => { e.preventDefault(); setPrompt(e); setVisible(true); };
    window.addEventListener('beforeinstallprompt', handler);
    return () => window.removeEventListener('beforeinstallprompt', handler);
  }, []);

  if (!visible || !prompt) return null;

  const install = async () => {
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    setVisible(false);
  };

  return (
    <div style={{
      position: "fixed", bottom: 20, left: 16, right: 16, zIndex: 9998,
      background: "#1a1a2e", borderRadius: 20, padding: "16px 20px",
      display: "flex", alignItems: "center", gap: 14,
      boxShadow: "0 8px 32px rgba(0,0,0,0.35)",
      animation: "slideUp .35s ease",
    }}>
      <div style={{ fontSize: 32 }}>🏆</div>
      <div style={{ flex: 1 }}>
        <p style={{ color: "#fff", fontWeight: 700, fontSize: 15 }}>Install Escape Wars</p>
        <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 13 }}>Add to home screen for the best experience</p>
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={() => setVisible(false)} style={{
          background: "rgba(255,255,255,0.1)", border: "none", borderRadius: 10,
          padding: "8px 12px", color: "rgba(255,255,255,0.6)", fontSize: 13, fontWeight: 600,
          cursor: "pointer",
        }}>Not now</button>
        <button onClick={install} style={{
          background: ACCENT, border: "none", borderRadius: 10,
          padding: "8px 16px", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer",
        }}>Install</button>
      </div>
    </div>
  );
};

/* ─── SCREEN: HOME ───────────────────────────────────── */
const HomeScreen = ({ data, onSeasonSelect, onNewSeason }) => {
  const activeSeason = data.seasons.find(s => s.active);
  const topTeam = activeSeason
    ? [...activeSeason.teams].sort((a,b) => b.points - a.points)[0]
    : null;

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 32 }}>
      <div style={{
        background: `linear-gradient(135deg, ${ACCENT} 0%, #3B1FA8 100%)`,
        padding: "env(safe-area-inset-top, 48px) 20px 28px",
        borderRadius: "0 0 32px 32px",
      }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div>
            <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 13, fontWeight: 500 }}>Welcome back 👋</p>
            <h2 style={{ color: "#fff", fontSize: 28, fontWeight: 800, lineHeight: 1.2 }}>Escape Wars</h2>
          </div>
          <div style={{ width: 46, height: 46, borderRadius: 14, background: "rgba(255,255,255,0.2)", display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="trophy" size={24} color="#fff" />
          </div>
        </div>

        {activeSeason ? (
          <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 20, padding: "16px 18px", backdropFilter: "blur(10px)", border: "1px solid rgba(255,255,255,0.2)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <p style={{ color: "rgba(255,255,255,0.65)", fontSize: 11, fontWeight: 600, letterSpacing: 1, marginBottom: 3 }}>ACTIVE SEASON</p>
                <p style={{ color: "#fff", fontSize: 18, fontWeight: 700 }}>{activeSeason.name}</p>
                <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 13 }}>{activeSeason.subtitle}</p>
              </div>
              <div style={{ textAlign: "right" }}>
                <p style={{ color: "rgba(255,255,255,0.65)", fontSize: 11, fontWeight: 600 }}>GAMES</p>
                <p style={{ color: "#fff", fontSize: 30, fontWeight: 800 }}>{activeSeason.games}</p>
              </div>
            </div>
            <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
              <div style={{ flex: 1, background: "rgba(255,255,255,0.15)", borderRadius: 12, padding: "8px 12px" }}>
                <p style={{ color: "rgba(255,255,255,0.65)", fontSize: 11 }}>LEADING</p>
                <p style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>🥇 {topTeam ? topTeam.name.split(" ")[0] : "—"}</p>
              </div>
              <div style={{ flex: 1, background: "rgba(255,255,255,0.15)", borderRadius: 12, padding: "8px 12px" }}>
                <p style={{ color: "rgba(255,255,255,0.65)", fontSize: 11 }}>TEAMS</p>
                <p style={{ color: "#fff", fontSize: 14, fontWeight: 700 }}>{activeSeason.teams.length} teams</p>
              </div>
            </div>
          </div>
        ) : (
          <div style={{ background: "rgba(255,255,255,0.15)", borderRadius: 20, padding: "16px 18px", textAlign: "center" }}>
            <p style={{ color: "rgba(255,255,255,0.8)", fontSize: 15, fontWeight: 600 }}>No active season</p>
            <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 13 }}>Create a season to get started</p>
          </div>
        )}
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        <div style={{ display: "flex", gap: 10, marginBottom: 24 }}>
          {activeSeason && (
            <button onClick={() => onSeasonSelect(activeSeason)} style={{
              flex: 1, background: ACCENT, color: "#fff", border: "none", borderRadius: 16,
              padding: "15px 0", fontSize: 15, fontWeight: 700, cursor: "pointer",
              display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
              fontFamily: "DM Sans, sans-serif", boxShadow: `0 6px 20px ${ACCENT}40`,
            }}>
              <Icon name="lightning" size={18} color="#fff" />Start Game
            </button>
          )}
          <button onClick={onNewSeason} style={{
            flex: activeSeason ? 1 : undefined, width: activeSeason ? undefined : "100%",
            background: "#fff", color: ACCENT, border: `2px solid ${ACCENT}20`,
            borderRadius: 16, padding: "15px 0", fontSize: 15, fontWeight: 700,
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
            gap: 8, fontFamily: "DM Sans, sans-serif",
          }}>
            <Icon name="plus" size={18} color={ACCENT} />New Season
          </button>
        </div>

        <h3 style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e", marginBottom: 12 }}>All Seasons</h3>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {data.seasons.slice().reverse().map(season => (
            <Card key={season.id} onClick={() => onSeasonSelect(season)} style={{ padding: "16px 18px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                <div style={{ width: 46, height: 46, borderRadius: 14, flexShrink: 0, background: season.active ? ACCENT + "18" : "#F0EFF8", display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <Icon name="calendar" size={22} color={season.active ? ACCENT : "#9494AF"} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 2 }}>
                    <p style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e" }}>{season.name}</p>
                    {season.active && <Badge>Active</Badge>}
                  </div>
                  <p style={{ fontSize: 13, color: "#8888A0", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{season.subtitle} · {season.games} games</p>
                </div>
                <div style={{ textAlign: "right", flexShrink: 0 }}>
                  <p style={{ fontSize: 22, fontWeight: 800, color: ACCENT }}>{season.teams.length}</p>
                  <p style={{ fontSize: 11, color: "#9494AF" }}>teams</p>
                </div>
              </div>
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ─── SCREEN: SEASON DETAIL ──────────────────────────── */
const SeasonDetailScreen = ({ season, onBack, onStartGame, onManageTeams }) => {
  const sorted = [...season.teams].sort((a,b) => b.points - a.points);

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 32 }}>
      <div style={{
        background: `linear-gradient(135deg, ${ACCENT} 0%, #3B1FA8 100%)`,
        padding: "env(safe-area-inset-top, 48px) 0 28px",
        borderRadius: "0 0 32px 32px",
      }}>
        <Header title={season.name} onBack={onBack}
          action={season.active && (
            <button onClick={onManageTeams} style={{
              background: "rgba(255,255,255,0.2)", border: "none", borderRadius: 12,
              padding: "8px 14px", color: "#fff", fontSize: 13, fontWeight: 600,
              cursor: "pointer", fontFamily: "DM Sans, sans-serif",
              display: "flex", alignItems: "center", gap: 6,
            }}>
              <Icon name="team" size={15} color="#fff" />Teams
            </button>
          )}
        />
        <div style={{ padding: "4px 20px 0" }}>
          <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 14 }}>{season.subtitle}</p>
          <div style={{ display: "flex", gap: 20, marginTop: 12 }}>
            {[["Games", season.games], ["Teams", season.teams.length], ["Top pts", Math.max(...season.teams.map(t => t.points))]].map(([label, val]) => (
              <div key={label}>
                <p style={{ color: "#fff", fontSize: 24, fontWeight: 800 }}>{val}</p>
                <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 12 }}>{label}</p>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        {/* Podium */}
        {sorted.length >= 3 && (
          <>
            <h3 style={{ fontSize: 16, fontWeight: 700, color: "#1a1a2e", marginBottom: 14 }}>🏆 Standings</h3>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 6, marginBottom: 16 }}>
              {[sorted[1], sorted[0], sorted[2]].map((team, i) => {
                const heights = [88, 110, 74];
                const ranks = [1, 0, 2];
                const rank = ranks[i];
                const bgColors = [ACCENT, "#B8B8CC", "#CD9B6E"];
                return (

/* ─── SCREEN: LIVE GAME ──────────────────────────────── */
const LiveGameScreen = ({ season, onBack, onFinish }) => {
  const DURATION = 45 * 60;
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(true);
  const [escaped, setEscaped] = useState({});
  const intervalRef = useRef(null);

  // Persist timer in localStorage
  useEffect(() => {
    const saved = localStorage.getItem('escape-wars-timer');
    if (saved) {
      try { const { e, r } = JSON.parse(saved); setElapsed(e); setRunning(r); } catch {}
    }
  }, []);

  useEffect(() => {
    localStorage.setItem('escape-wars-timer', JSON.stringify({ e: elapsed, r: running }));
  }, [elapsed, running]);

  useEffect(() => {
    if (running) {
      intervalRef.current = setInterval(() => {
        setElapsed(e => {
          if (e >= DURATION) { setRunning(false); return DURATION; }
          return e + 1;
        });
      }, 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [running]);

  const fmt = s => `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
  const progress = Math.min(elapsed / DURATION, 1);
  const r = 76, circ = 2 * Math.PI * r;
  const escapedCount = Object.values(escaped).filter(Boolean).length;
  const timerColor = progress > 0.85 ? "#FF5050" : progress > 0.65 ? "#FFB830" : ACCENT;

  const toggleEscaped = (id) => {
    if (!escaped[id]) {
      setEscaped(prev => ({ ...prev, [id]: elapsed }));
    } else {
      setEscaped(prev => { const n = {...prev}; delete n[id]; return n; });
    }
  };

  const sortedByEscape = [...season.teams].sort((a, b) => {
    const ae = escaped[a.id], be = escaped[b.id];
    if (ae && be) return ae - be;
    if (ae) return -1;
    if (be) return 1;
    return 0;
  });

  const endGame = () => {
    setRunning(false);
    localStorage.removeItem('escape-wars-timer');
    onFinish(escaped, elapsed);
  };

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 32 }}>
      <div style={{
        background: "linear-gradient(160deg, #1a1a2e 0%, #2D1B69 100%)",
        padding: "env(safe-area-inset-top, 48px) 0 28px",
        borderRadius: "0 0 32px 32px",
      }}>
        <Header title="Live Game" onBack={onBack}
          action={
            <button onClick={() => setRunning(r => !r)} style={{
              background: running ? "rgba(255,80,80,0.25)" : "rgba(80,255,150,0.25)",
              border: "none", borderRadius: 12, padding: "8px 16px",
              color: running ? "#FF8080" : "#50FF96", fontSize: 13, fontWeight: 700,
              cursor: "pointer", fontFamily: "DM Sans, sans-serif",
            }}>
              {running ? "⏸ Pause" : "▶ Resume"}
            </button>
          }
        />
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "8px 0 0" }}>
          <svg width={190} height={190} viewBox="0 0 190 190">
            <circle cx={95} cy={95} r={r} fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth={9} />
            <circle cx={95} cy={95} r={r} fill="none"
              stroke={timerColor} strokeWidth={9} strokeLinecap="round"
              strokeDasharray={circ} strokeDashoffset={circ * (1 - progress)}
              transform="rotate(-90 95 95)"
              style={{ transition: "stroke-dashoffset 0.9s linear, stroke 0.5s" }}
            />
            <text x={95} y={88} textAnchor="middle" fill="#fff" fontSize={34} fontWeight={800} fontFamily="DM Sans, sans-serif">{fmt(elapsed)}</text>
            <text x={95} y={112} textAnchor="middle" fill="rgba(255,255,255,0.45)" fontSize={13} fontFamily="DM Sans, sans-serif">of {fmt(DURATION)}</text>
          </svg>
          <div style={{ display: "flex", gap: 24, marginTop: 4 }}>
            {[["Escaped", escapedCount, "#50FF96"], ["Remaining", season.teams.length - escapedCount, "#fff"], ["Left", fmt(DURATION - elapsed), progress > 0.85 ? "#FF8080" : "#fff"]].map(([label, val, col]) => (
              <div key={label} style={{ textAlign: "center" }}>
                <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>{label}</p>
                <p style={{ color: col, fontSize: 20, fontWeight: 800 }}>{val}</p>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e", marginBottom: 12 }}>Tap when team escapes 👇</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
          {sortedByEscape.map((team) => {
            const escapeTime = escaped[team.id];
            const isEscaped = !!escapeTime;
            const escapeOrder = isEscaped
              ? Object.entries(escaped).sort((a,b) => a[1]-b[1]).map(([k]) => parseInt(k)).indexOf(team.id) + 1
              : null;
            return (
              <button key={team.id} onClick={() => toggleEscaped(team.id)} style={{
                background: isEscaped ? team.color + "12" : "#fff",
                border: isEscaped ? `2px solid ${team.color}60` : "2px solid transparent",
                borderRadius: 20, padding: "14px 16px", cursor: "pointer",
                fontFamily: "DM Sans, sans-serif",
                display: "flex", alignItems: "center", gap: 12,
                transition: "all .2s", boxShadow: isEscaped ? `0 4px 16px ${team.color}25` : "0 2px 8px rgba(0,0,0,0.06)",
                WebkitTapHighlightColor: "transparent",
              }}>
                <div style={{
                  width: 42, height: 42, borderRadius: 13,
                  background: isEscaped ? team.color : team.color + "20",
                  display: "flex", alignItems: "center", justifyContent: "center", transition: "all .2s",
                }}>
                  {isEscaped ? <Icon name="check" size={20} color="#fff" /> : <Icon name="team" size={18} color={team.color} />}
                </div>
                <div style={{ flex: 1, textAlign: "left" }}>
                  <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{team.name}</p>
                  <p style={{ fontSize: 12, color: isEscaped ? team.color : "#9494AF", fontWeight: isEscaped ? 600 : 400 }}>
                    {isEscaped ? `Escaped! #${escapeOrder} · ${fmt(escapeTime)}` : "Still inside…"}
                  </p>
                </div>
                {isEscaped && escapeOrder <= 3 && <span style={{ fontSize: 22 }}>{MEDALS[escapeOrder - 1]}</span>}
              </button>
            );
          })}
        </div>
        <Btn onClick={endGame} variant="dark" style={{ width: "100%", borderRadius: 20, padding: "16px 0", fontSize: 17 }}>
          <Icon name="check" size={20} color="#fff" />End Game & Save Results
        </Btn>
      </div>
    </div>
  );
};

/* ─── SCREEN: RESULTS ────────────────────────────────── */
const ResultScreen = ({ season, escapedMap, finalTime, onBack, onSave }) => {
  const fmt = s => `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;

  // Sort teams by escape order
  const escapedEntries = Object.entries(escapedMap || {})
    .filter(([,v]) => v)
    .sort((a,b) => a[1] - b[1])
    .map(([k]) => parseInt(k));

  const [bonuses, setBonuses] = useState({});
  const [notes, setNotes] = useState("");
  const [saved, setSaved] = useState(false);

  const getBase = (teamId) => {
    const order = escapedEntries.indexOf(teamId);
    if (order === -1) return 0;
    return BASE_PTS[order] ?? 1;
  };

  const sorted = [...season.teams].sort((a,b) => {
    const ai = escapedEntries.indexOf(a.id), bi = escapedEntries.indexOf(b.id);
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1; if (bi === -1) return -1;
    return ai - bi;
  });

  const handleSave = () => {
    setSaved(true);
    onSave({ escapedEntries, bonuses, notes, finalTime });
  };

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 40 }}>
      <div style={{
        background: `linear-gradient(135deg, ${ACCENT} 0%, #3B1FA8 100%)`,
        padding: "env(safe-area-inset-top, 48px) 0 24px",
        borderRadius: "0 0 32px 32px",
      }}>
        <Header title="Game Results" onBack={onBack} />
        <div style={{ padding: "8px 16px 0", display: "flex", gap: 10 }}>
          {[["Time", fmt(finalTime || 0)], ["Escaped", `${escapedEntries.length}/${season.teams.length}`], ["Date", "May 1"]].map(([label, val]) => (
            <div key={label} style={{ flex: 1, background: "rgba(255,255,255,0.15)", borderRadius: 14, padding: "10px 12px" }}>
              <p style={{ color: "rgba(255,255,255,0.65)", fontSize: 11, fontWeight: 600 }}>{label}</p>
              <p style={{ color: "#fff", fontSize: 17, fontWeight: 800 }}>{val}</p>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e", marginBottom: 6 }}>Points Breakdown</p>
        <p style={{ fontSize: 13, color: "#9494AF", marginBottom: 14 }}>Tap +/− to add bonus points per team</p>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18 }}>
          {sorted.map((team) => {
            const isEscaped = escapedEntries.includes(team.id);
            const order = escapedEntries.indexOf(team.id);
            const base = getBase(team.id);
            const bonus = bonuses[team.id] || 0;
            const total = base + bonus;
            return (
              <Card key={team.id} style={{ padding: "13px 16px" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 18, width: 26 }}>{isEscaped ? (MEDALS[order] || `${order+1}`) : "❌"}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{team.name}</p>
                    <p style={{ fontSize: 12, color: isEscaped ? "#4CAF88" : "#FF6B6B", fontWeight: 600 }}>
                      {isEscaped ? `Escaped — Base: ${base}pts` : "Did not escape"}
                    </p>
                  </div>
                  {isEscaped ? (
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <button onClick={() => setBonuses(prev => ({...prev, [team.id]: Math.max(0,(prev[team.id]||0)-1)}))} style={{
                        width: 30, height: 30, borderRadius: 10, background: "#F0EFF8", border: "none",
                        cursor: "pointer", fontSize: 16, fontWeight: 700, color: ACCENT,
                      }}>−</button>
                      <div style={{ textAlign: "center", minWidth: 38 }}>
                        <p style={{ fontSize: 20, fontWeight: 800, color: ACCENT }}>{total}</p>
                        <p style={{ fontSize: 10, color: "#9494AF" }}>pts</p>
                      </div>
                      <button onClick={() => setBonuses(prev => ({...prev, [team.id]: (prev[team.id]||0)+1}))} style={{
                        width: 30, height: 30, borderRadius: 10, background: ACCENT, border: "none",
                        cursor: "pointer", fontSize: 16, fontWeight: 700, color: "#fff",
                      }}>+</button>
                    </div>
                  ) : (
                    <p style={{ fontSize: 20, fontWeight: 800, color: "#CCC" }}>0</p>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
        <div style={{ marginBottom: 18 }}>
          <p style={{ fontSize: 14, fontWeight: 600, color: "#1a1a2e", marginBottom: 8 }}>Notes</p>
          <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Any notes about this game…" style={{
            width: "100%", borderRadius: 16, border: "1.5px solid #E0DFF0", padding: "12px 14px",
            fontSize: 14, fontFamily: "DM Sans, sans-serif", color: "#1a1a2e", resize: "none",
            background: "#fff", outline: "none", height: 80,
          }} />
        </div>
        <Btn onClick={handleSave} disabled={saved} style={{ width: "100%", borderRadius: 20, padding: "16px 0", fontSize: 17 }}>
          <Icon name="check" size={20} color="#fff" />
          {saved ? "Saved!" : "Save Results"}
        </Btn>
      </div>
    </div>
  );
};

/* ─── SCREEN: TEAM MANAGEMENT ────────────────────────── */
const TeamManagementScreen = ({ season, onBack, onUpdate }) => {
  const [teams, setTeams] = useState(season.teams);
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [editId, setEditId] = useState(null);
  const [editName, setEditName] = useState("");

  const commit = (newTeams) => { setTeams(newTeams); onUpdate(newTeams); };

  const addTeam = () => {
    if (!newName.trim()) return;
    const t = { id: Date.now(), name: newName.trim(), color: TEAM_COLORS[teams.length % TEAM_COLORS.length], wins: 0, losses: 0, points: 0, bestTime: "—" };
    commit([...teams, t]);
    setNewName(""); setAdding(false);
  };

  const removeTeam = (id) => commit(teams.filter(t => t.id !== id));

  const saveEdit = (id) => {
    if (!editName.trim()) return;
    commit(teams.map(t => t.id === id ? {...t, name: editName.trim()} : t));
    setEditId(null); setEditName("");
  };

  return (
    <div style={{ background: "#F4F4F6", minHeight: "100%", paddingBottom: 32 }}>
      <div style={{
        background: `linear-gradient(135deg, ${ACCENT} 0%, #3B1FA8 100%)`,
        padding: "env(safe-area-inset-top, 48px) 0 24px",
        borderRadius: "0 0 32px 32px",
      }}>
        <Header title="Manage Teams" onBack={onBack}
          action={
            <button onClick={() => { setAdding(true); setEditId(null); }} style={{
              background: "rgba(255,255,255,0.2)", border: "none", borderRadius: 12,
              padding: "8px 14px", color: "#fff", fontSize: 13, fontWeight: 600,
              cursor: "pointer", fontFamily: "DM Sans, sans-serif",
              display: "flex", alignItems: "center", gap: 6,
            }}>
              <Icon name="plus" size={15} color="#fff" />Add
            </button>
          }
        />
        <p style={{ color: "rgba(255,255,255,0.7)", fontSize: 14, padding: "4px 20px 0" }}>
          {season.name} · {teams.length} / 10 teams
        </p>
      </div>

      <div style={{ padding: "20px 16px 0" }}>
        {adding && (
          <Card style={{ padding: "16px", marginBottom: 14, border: `2px solid ${ACCENT}30` }}>
            <p style={{ fontSize: 14, fontWeight: 700, color: "#1a1a2e", marginBottom: 10 }}>New Team</p>
            <input value={newName} onChange={e => setNewName(e.target.value)}
              onKeyDown={e => e.key === "Enter" && addTeam()}
              placeholder="Team name…" autoFocus
              style={{ width: "100%", border: `1.5px solid ${ACCENT}50`, borderRadius: 12, padding: "10px 14px", fontSize: 15, outline: "none", color: "#1a1a2e", marginBottom: 10 }}
            />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={addTeam} style={{ flex: 1, background: ACCENT, color: "#fff", border: "none", borderRadius: 12, padding: "11px 0", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "DM Sans, sans-serif" }}>Add Team</button>
              <button onClick={() => setAdding(false)} style={{ background: "#F0EFF8", color: "#8888A0", border: "none", borderRadius: 12, padding: "11px 16px", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "DM Sans, sans-serif" }}>Cancel</button>
            </div>
          </Card>
        )}

        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {teams.map(team => (
            <Card key={team.id} style={{ padding: "13px 16px" }}>
              {editId === team.id ? (
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <input value={editName} onChange={e => setEditName(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && saveEdit(team.id)}
                    autoFocus
                    style={{ flex: 1, border: `1.5px solid ${ACCENT}50`, borderRadius: 10, padding: "8px 12px", fontSize: 15, outline: "none", color: "#1a1a2e" }}
                  />
                  <button onClick={() => saveEdit(team.id)} style={{ background: ACCENT, border: "none", borderRadius: 10, padding: "8px 14px", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer", fontFamily: "DM Sans, sans-serif" }}>Save</button>
                  <button onClick={() => setEditId(null)} style={{ background: "#F0EFF8", border: "none", borderRadius: 10, padding: "8px 12px", color: "#8888A0", fontSize: 13, fontWeight: 600, cursor: "pointer", fontFamily: "DM Sans, sans-serif" }}>✕</button>
                </div>
              ) : (
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 42, height: 42, borderRadius: 13, background: team.color + "20", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <Icon name="team" size={20} color={team.color} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: 15, fontWeight: 700, color: "#1a1a2e" }}>{team.name}</p>
                    <p style={{ fontSize: 12, color: "#9494AF" }}>{team.wins}W · {team.losses}L · {team.points}pts</p>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => { setEditId(team.id); setEditName(team.name); }} style={{ width: 32, height: 32, background: "#F0EFF8", border: "none", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <Icon name="edit" size={15} color="#8888A0" />
                    </button>
                    <button onClick={() => removeTeam(team.id)} style={{ width: 32, height: 32, background: "#FFE8E8", border: "none", borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <Icon name="trash" size={15} color="#FF5252" />
                    </button>
                  </div>
                </div>
              )}
            </Card>
          ))}
        </div>
      </div>
    </div>
  );
};

  const [screen, setScreen] = useState("home");
  const [selectedSeasonId, setSelectedSeasonId] = useState(null);
  const [gameState, setGameState] = useState(null);
  const [toast, setToast] = useState(null);

  const showToast = (msg) => setToast(msg);

  const selectedSeason = data.seasons.find(s => s.id === selectedSeasonId) || null;

  const updateData = (newData) => { setData(newData); saveData(newData); };

  const navigate = (s, extra = {}) => {
    setScreen(s);
    if (extra.seasonId !== undefined) setSelectedSeasonId(extra.seasonId);
  };

  const handleSaveResults = ({ escapedEntries, bonuses, finalTime }) => {
    if (!selectedSeason) return;
    const fmt = s => `${Math.floor(s/60).toString().padStart(2,"0")}:${(s%60).toString().padStart(2,"0")}`;
    const newTeams = selectedSeason.teams.map(team => {
      const isEscaped = escapedEntries.includes(team.id);
      const order = escapedEntries.indexOf(team.id);
      const base = isEscaped ? (BASE_PTS[order] ?? 1) : 0;
      const bonus = bonuses[team.id] || 0;
      const pts = base + bonus;
      const newBestTime = isEscaped
        ? (team.bestTime === "—" || finalTime < parseInt(team.bestTime.split(":")[0])*60 + parseInt(team.bestTime.split(":")[1])
          ? fmt(finalTime) : team.bestTime)
        : team.bestTime;
      return { ...team, wins: isEscaped ? team.wins + 1 : team.wins, losses: !isEscaped ? team.losses + 1 : team.losses, points: team.points + pts, bestTime: newBestTime };
    });
    const newData = {
      ...data,
      seasons: data.seasons.map(s => s.id === selectedSeasonId
        ? { ...s, teams: newTeams, games: s.games + 1 }
        : s
      ),
    };
    updateData(newData);
    showToast("Results saved!");
    navigate("season", { seasonId: selectedSeasonId });
  };

  const handleCreateSeason = ({ name, subtitle }) => {
    const newSeason = {
      id: Date.now(), name, subtitle, year: new Date().getFullYear(), active: true,
      games: 0, teams: [],
    };
    const newData = { ...data, seasons: [...data.seasons.map(s => ({...s, active: false})), newSeason] };
    updateData(newData);
    showToast("Season created!");
    navigate("season", { seasonId: newSeason.id });
  };

  const handleUpdateTeams = (newTeams) => {
    const newData = { ...data, seasons: data.seasons.map(s => s.id === selectedSeasonId ? {...s, teams: newTeams} : s) };
    updateData(newData);
  };

  return (
    <div style={{ height: "100%", width: "100%", overflow: "hidden", position: "relative", background: "#F4F4F6" }}>
      <div style={{ height: "100%", overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
        {screen === "home" && (
          <HomeScreen data={data}
            onSeasonSelect={s => navigate("season", { seasonId: s.id })}
            onNewSeason={() => navigate("newSeason")}
          />
        )}
        {screen === "season" && selectedSeason && (
          <SeasonDetailScreen season={selectedSeason}
            onBack={() => navigate("home")}
            onStartGame={() => navigate("liveGame")}
            onManageTeams={() => navigate("teams")}
          />
        )}
        {screen === "liveGame" && selectedSeason && (
          <LiveGameScreen season={selectedSeason}
            onBack={() => navigate("season")}
            onFinish={(escapedMap, elapsed) => { setGameState({ escapedMap, elapsed }); navigate("results"); }}
          />
        )}
        {screen === "results" && selectedSeason && gameState && (
          <ResultScreen season={selectedSeason}
            escapedMap={gameState.escapedMap} finalTime={gameState.elapsed}
            onBack={() => navigate("liveGame")}
            onSave={handleSaveResults}
          />
        )}
        {screen === "teams" && selectedSeason && (
          <TeamManagementScreen season={selectedSeason}
            onBack={() => navigate("season")}
            onUpdate={handleUpdateTeams}
          />
        )}
        {screen === "newSeason" && (
          <NewSeasonScreen
            nextNum={data.seasons.length + 1}
            onBack={() => navigate("home")}
            onSave={handleCreateSeason}
          />
        )}
      </div>

      {toast && <Toast message={toast} onDone={() => setToast(null)} />}
      <InstallBanner />

      <style>{`
        @keyframes fadeUp { from { opacity:0; transform: translate(-50%, 10px); } to { opacity:1; transform: translate(-50%, 0); } }
        @keyframes slideUp { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        button:active { opacity: 0.85; }
      `}</style>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
